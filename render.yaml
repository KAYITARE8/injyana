services:
  - type: web
    name: injyana
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_STORAGE
        value: local
      - key: MAX_UPLOAD_MB
        value: "50"
